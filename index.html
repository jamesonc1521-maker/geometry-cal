<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantsWeb Ultra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0c0c10;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #calculator {
      width: 100%;
      max-width: 340px;
      background: #15151c;
      border-radius: 24px;
      padding: 24px;
    }
    #display {
      background: #0a0a0e;
      color: #22c55e;
      font-size: 2.3rem;
      text-align: right;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      font-family: monospace;
      min-height: 70px;
      overflow-x: auto;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }
    .keys button {
      border: none;
      border-radius: 12px;
      padding: 17px 0;
      font-size: 1.25rem;
      cursor: pointer;
      background: #1c1c26;
      color: white;
    }
    .keys button.op { background: #252532; color: #22c55e; }
    .keys button.eq { background: #22c55e; color: #000; font-weight: 700; }
    .keys button.clear { background: #ef4444; }

    #app {
      display: none;
      width: 100%;
      max-width: 1100px;
      background: #15151c;
      border-radius: 20px;
      overflow: hidden;
      flex-direction: column;
      min-height: 90vh;
    }
    header {
      background: #1c1c26;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 1.35rem; color: #22c55e; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button {
      background: transparent;
      border: 1px solid #333;
      color: #a1a1aa;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
    }
    nav button.active { background: #22c55e; color: #000; border-color: #22c55e; }

    main { flex: 1; padding: 20px; overflow-y: auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .welcome { text-align: center; padding: 60px 20px; }
    .welcome h2 { font-size: 2.4rem; color: #22c55e; margin-bottom: 10px; }
    .welcome p { color: #71717a; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .game-card {
      background: #1c1c26;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #2a2a36;
      cursor: pointer;
      transition: 0.2s;
    }
    .game-card:hover { border-color: #22c55e; transform: translateY(-2px); }
    .game-card h3 { color: #fff; margin-bottom: 6px; }
    .game-card p { color: #71717a; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- Calculator Screen -->
  <div id="calculator">
    <div id="display">0</div>
    <div class="keys">
      <button class="clear" onclick="clearCalc()">C</button>
      <button class="op" onclick="press('(')">(</button>
      <button class="op" onclick="press(')')">)</button>
      <button class="op" onclick="press('/')">÷</button>
      
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="op" onclick="press('*')">×</button>
      
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="op,">-</button>
      <button class="op" onclick="press('-')">-</button>
      
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="op" onclick="press('+')">+</button>
      
      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button onclick="backspace()">⌫</button>
      <button class="eq" onclick="compute()">=</button>
    </div>
  </div>

  <!-- Unlocked Hub Screen -->
  <div id="app">
    <header>
      <h1>FantsWeb Ultra Hub</h1>
      <nav>
        <button class="active" onclick="switchTab('home', this)">Home</button>
        <button onclick="switchTab('games', this)">Games</button>
        <button onclick="lockHub()" style="background:#ef4444; color:#fff; border:none;">Lock</button>
      </nav>
    </header>
    <main>
      <div id="home" class="panel active">
        <div class="welcome">
          <h2>Welcome Back</h2>
          <p>Select a tab above to access your dashboard apps and games.</p>
        </div>
      </div>
      <div id="games" class="panel">
        <div class="game-grid">
          <div class="game-card" onclick="alert('Launching Game...')">
            <h3>Mini Game Portal</h3>
            <p>Click to open unblocked entertainment apps.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentInput = "";
    const display = document.getElementById("display");

    function press(val) {
      if (currentInput === "0" && val !== ".") currentInput = "";
      currentInput += val;
      display.innerText = currentInput;
    }

    function clearCalc() {
      currentInput = "";
      display.innerText = "0";
    }

    function backspace() {
      currentInput = currentInput.slice(0, -1);
      if (currentInput === "") display.innerText = "0";
      else display.innerText = currentInput;
    }

    function compute() {
      if (currentInput === "1337") {
        document.getElementById("calculator").style.display = "none";
        document.getElementById("app").style.display = "flex";
        currentInput = "";
        display.innerText = "0";
        return;
      }
      try {
        currentInput = eval(currentInput).toString();
        display.innerText = currentInput;
      } catch (e) {
        display.innerText = "Error";
        currentInput = "";
      }
    }

    function lockHub() {
      document.getElementById("app").style.display = "none";
      document.getElementById("calculator").style.display = "block";
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => {
        if(b.innerText !== 'Lock') b.classList.remove('active');
      });
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
